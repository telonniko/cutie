    renderer.setPixelRatio(pr);
    const c = renderer.domElement;
    c.style.width = '100%';
    c.style.height = '100%';
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  /* ------------------------------------------------------------------------ *
   *  Public hook for the screenshot harness (tools/render-screenshot.js).     *
   * ---------------------------------------------------------------------- */
  window.__RUBIKS__ = {
    get ready() { return solverReady; },
    get status() { return state.status; },
    setCamera: () => { controls.setView(HOME_POS); controls.spherical.theta = controls.thetaTarget; controls.spherical.phi = controls.phiTarget; controls.spherical.radius = controls.radiusTarget; },

    // Test hooks (read-only): let headless tests verify the camera / cube
    // projection without reaching into module scope.
    getSpherical: () => ({ theta: controls.spherical.theta, phi: controls.spherical.phi, radius: controls.spherical.radius, thetaTarget: controls.thetaTarget, phiTarget: controls.phiTarget, radiusTarget: controls.radiusTarget }),
    projectWorld: (x = 0, y = 0, z = 0) => { const p = new THREE.Vector3(x, y, z).project(camera); return { x: p.x, y: p.y }; },
    // The current empty-space canvas rect (stage-relative) and the measured
    // bands that produced it (top: banner + 16; left: tab/card edge + 16;
    // bottom: the reserved 3-row Move Log height).
    canvasBands: () => {
      const sr = stage.getBoundingClientRect();
      const cr = renderer.domElement.getBoundingClientRect();
      const edge = drawerOpen
        ? controlDrawer.children[0].getBoundingClientRect().right
        : controlTab.getBoundingClientRect().right;
      return {
        left: cr.left - sr.left, top: cr.top - sr.top,
        right: sr.right - cr.right, bottom: sr.bottom - cr.bottom,
        w: cr.width, h: cr.height,
        bands: {
          top: (bannerEl.getBoundingClientRect().bottom - sr.top) + CLEARANCE,
          left: Math.max(0, (edge - sr.left) + CLEARANCE),
          bottom: reservedLogBand(),
        },
      };
    },
    cubeBox: () => { const b = new THREE.Box3().setFromObject(cubeGroup); return { min: [b.min.x, b.min.y, b.min.z], max: [b.max.x, b.max.y, b.max.z] }; },

    // Render a frame with a transparent background and return its pixels as raw
    // RGBA. Headless Chromium doesn't sync the GL canvas into page.screenshot, so
    // the harness reads the GL back buffer itself (gl.readPixels, inside
    // renderFrame), decodes it to a PNG, and composites it over the full-page
    // screenshot. `setPixelRatio(1)` is called by the harness so the returned
    // buffer matches the viewport 1:1.
    renderFrame,

    setPixelRatio,

    // Screenshot-only helper: render the Move Log with every move as "done"
    // (no animation) so a captured frame shows the full move-button sequence.
    syncLog: () => { state.playIndex = state.moves.length; renderMoves(); },

    isSolved: () => isSolved(cubies),
    waitUntilIdle: (maxMs = 10000) => new Promise(res => {
      const t0 = performance.now();
      const tick = () => { if (!state.busy || performance.now() - t0 > maxMs) return res(); setTimeout(tick, 60); };
      tick();
    }),
  };
  </script>

  </div><!-- /#stage -->

  <!-- ======================= Dismiss the drag-to-orbit hint ======================= -->
  <!-- Fade out and remove the drag-to-orbit onboarding hint on the FIRST key press
       or pointer interaction anywhere in the viewport — including any shortcut key
       and any button/tab click. A capture-phase document listener catches every
       such event no matter which element it starts from, and we do NOT stop
       propagation, so the app's own key/click handlers keep working. The hint is
       pointer-events:none, so the dismissing interaction passes through it. -->
  <script>
    (function hideHintsOnFirstInteraction() {
      const hints = [document.getElementById('drag-hint')].filter(Boolean);
      if (!hints.length) return;
      const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let dismissed = false;

      const dismiss = () => {
        if (dismissed) return;
        dismissed = true;
        document.removeEventListener('keydown', dismiss, true);
        document.removeEventListener('pointerdown', dismiss, true);
        for (const el of hints) {
          const remove = () => el.remove();
          if (REDUCED) { remove(); continue; }  // skip the animation
          el.style.transition = 'opacity 300ms ease-out';
          void el.offsetWidth;                   // flush so the opacity change animates
          el.style.opacity = '0';
          el.addEventListener('transitionend', remove, { once: true });
          setTimeout(remove, 360);               // fallback if transitionend never fires
        }
      };

      document.addEventListener('keydown', dismiss, true);
      document.addEventListener('pointerdown', dismiss, true);
    })();
  </script>
</body>
</html>
